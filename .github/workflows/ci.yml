# Pull-request checks.
#
# WHY THIS EXISTS
# deploy.yml only triggers on `push` to main, so until now nothing tested a pull
# request — including the Dependabot ones, which is backwards: a version bump is
# safe to merge only because something ran it.
#
# WHAT IT COVERS
# The suites that need neither vendor/obsidian-mobile/ nor a database. The
# Vercel build itself is not run here (it needs the Obsidian bundle, which is
# gitignored and downloaded only by the deploy workflow), but
# test/build-assets.test.js builds a fixture tree — so the copy/inject/patch
# pipeline is still exercised.
#
# src/sync-server runs under `bun test`, so it gets its own job below.
#
# STILL MISSING: src/deployments/cloudflare. Its build test executes
# scripts/build-assets.sh, which needs vendor/obsidian-mobile/ — a 40 MB
# download from GitHub releases that only the deploy workflow does — and its
# proxy test talks to the real network. Downloading the bundle on every PR to
# validate a wrangler bump is not worth it; see dependabot-auto-merge.yml,
# which says so where it matters.

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - src/deployments/vercel
          - src/client-mobile
          - src/runtime-server/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # src/client-mobile has a package.json for its `test` script but no
      # dependencies and no lockfile, and `npm ci` refuses to run without one.
      - name: Install
        working-directory: ${{ matrix.package }}
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "no package-lock.json here - nothing to install"
          fi

      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test

  # 26 tests, no network, no vendor/. Verified locally against bun 1.4.4.
  # `bun install` rather than --frozen-lockfile: this package still keeps a
  # package-lock.json and bun.lock is gitignored, so there is no lockfile to
  # freeze against.
  bun-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.x'

      - name: Install
        working-directory: src/sync-server
        run: bun install

      - name: Test
        working-directory: src/sync-server
        run: bun test
